events {}

http {
    resolver 127.0.0.11 valid=2s ipv6=off;
    client_max_body_size 64k;

    map "$status:$request_id" $loggable {
        default 0;
        ~^[45][0-9][0-9]: 1;
        ~^[23][0-9][0-9]:.*0[0-2]$ 1;
    }

    upstream tinytune_api {
        zone tinytune_api 64k;
        server api:8000 resolve;
        keepalive 256;
    }

    log_format json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"service":"gateway",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"request_time_seconds":$request_time,'
        '"upstream_time_seconds":"$upstream_response_time",'
        '"upstream":"$upstream_addr"'
    '}';

    access_log /dev/stdout json if=$loggable;
    error_log /dev/stderr warn;

    server {
        listen 8080;

        location ~ ^/(console|docs|redoc|openapi\.json|metrics|api/v1/(load-tests|console|ops)) { return 404; }

        location = /gateway-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok\n';
        }

        location / {
            proxy_pass http://tinytune_api;
            include /etc/nginx/tinytune-proxy.conf;
            proxy_set_header X-TinyTune-Surface customer;
        }
    }

    # Local load dashboard: no customer login, no customer data routes.
    server {
        listen 8081;
        location ~ ^/(auth|api/v1/(playlists|library)|docs|openapi\.json|metrics) { return 404; }
        location / {
            proxy_pass http://tinytune_api;
            include /etc/nginx/tinytune-proxy.conf;
            proxy_set_header X-TinyTune-Surface tools;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
        }
    }

    # API reference is read-only and has no customer data routes.
    server {
        listen 8082;
        location = / { return 302 /docs; }
        location ~ ^/(docs$|openapi\.json$|assets/) {
            proxy_pass http://tinytune_api;
            include /etc/nginx/tinytune-proxy.conf;
            proxy_set_header X-TinyTune-Surface docs;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
        }
        location / { return 404; }
    }
}

